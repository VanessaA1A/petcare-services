<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PetCare API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 32px;
            background: #f5f5f5;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            padding: 10px;
            width: 260px;
            margin-top: 4px;
        }

        button {
            display: block;
            margin-top: 18px;
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            background: #2f80ed;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        #log {
            margin-top: 24px;
            padding: 16px;
            background: white;
            border-radius: 8px;
            min-height: 220px;
            white-space: pre-wrap;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
<h1>PetCare API Test</h1>

<label>Service Request ID</label>
<input id="serviceRequestId" value="1001" />

<label>Caregiver ID</label>
<input id="caregiverId" value="2" />

<button onclick="createApplication()">Crear postulación</button>

<div id="log"></div>

<script>
    function log(message) {
        const box = document.getElementById("log");
        box.textContent += message + "\n";
    }

    async function createApplication() {
        const serviceRequestId = Number(document.getElementById("serviceRequestId").value);
        const caregiverId = Number(document.getElementById("caregiverId").value);

        const body = {
            service_request_id: serviceRequestId,
            caregiver_id: caregiverId,
            initiated_by: "CAREGIVER",
            status: "PENDING"
        };

        log("Enviando postulación:");
        log(JSON.stringify(body, null, 2));

        try {
            const response = await fetch("/api/service-applications", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
            });

            const text = await response.text();

            log("HTTP " + response.status);
            log(text);
        } catch (error) {
            log("Error: " + error.message);
        }
    }
</script>
</body>
</html>
