server:
  port: ${PORT:3001}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/PetCareBd
    username: postgres
    password: 2006
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    root: INFO
