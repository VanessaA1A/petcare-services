server:
  port: ${PORT:3001}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/PetCareBD
    username: postgres
    password: kelly123
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

security:
  jwt:
    secret: ${JWT_SECRET:petcare-development-secret-key-change-me-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

logging:
  level:
    root: INFO
