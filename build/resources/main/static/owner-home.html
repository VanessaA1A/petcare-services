<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetCare - Owner Home</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fbff; color: #222; padding: 24px; }
    h1 { color: #1a4a8a; }
    .card { background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 640px; margin: auto; }
    .button { margin-top: 20px; display: inline-block; padding: 12px 18px; background: #357edd; color: #fff; border: none; border-radius: 10px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Bienvenido, propietario</h1>
    <p>Has iniciado sesión correctamente como <strong>OWNER</strong>.</p>
    <div id="info"></div>
    <a id="logout" class="button" href="#">Cerrar sesión</a>
  </div>
  <script>
    const info = document.getElementById('info');
    const logout = document.getElementById('logout');
    const session = JSON.parse(localStorage.getItem('petcare.session') || 'null');
    if (!session || !session.token || session.user?.rol !== 'OWNER') {
      window.location.href = '/login';
    } else {
      info.innerHTML = `<p>Usuario: <strong>${session.user.email}</strong></p><p>Rol: <strong>${session.user.rol}</strong></p>`;
    }
    logout.addEventListener('click', (event) => {
      event.preventDefault();
      localStorage.removeItem('petcare.session');
      window.location.href = '/login';
    });
  </script>
</body>
</html>
