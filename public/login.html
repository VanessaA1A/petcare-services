<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetCare - Login</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f7fa; color: #333; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { width: 100%; max-width: 420px; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); }
    .card h1 { margin-top: 0; font-size: 24px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; margin-bottom: 6px; font-weight: 600; }
    .field input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; }
    .button { width: 100%; padding: 12px; background: #357edd; border: none; border-radius: 8px; color: #fff; font-size: 16px; cursor: pointer; }
    .button:hover { background: #2d6fc8; }
    .footer { margin-top: 16px; font-size: 14px; }
    .footer a { color: #357edd; text-decoration: none; }
    .message { margin: 16px 0 0; padding: 12px; border-radius: 8px; display: none; }
    .message.success { background: #e6f4ea; color: #1b5e20; }
    .message.error { background: #fdecea; color: #8a1f11; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Iniciar sesión</h1>
    <form id="loginForm">
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" required />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required />
      </div>
      <button class="button" type="submit">Entrar</button>
    </form>
    <div id="message" class="message"></div>
    <div class="footer">
      <p>¿No tienes cuenta? <a href="/register">Crear usuario</a></p>
    </div>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const messageBox = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      messageBox.style.display = 'none';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || 'Error de autenticación');
        messageBox.textContent = 'Inicio de sesión correcto. Token de sesión creado.';
        messageBox.className = 'message success';
      } catch (err) {
        messageBox.textContent = err.message;
        messageBox.className = 'message error';
      }
      messageBox.style.display = 'block';
    });
  </script>
</body>
</html>
