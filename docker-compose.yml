services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME:-PetCareBD}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/petcare_restore.sql:/docker-entrypoint-initdb.d/petcare_restore.sql:ro
      - ./migrations/002_add_rol_confirmado.sql:/docker-entrypoint-initdb.d/z02_migration.sql:ro
      - ./migrations/003_add_ubicacion_usuarios.sql:/docker-entrypoint-initdb.d/z03_migration.sql:ro
      - ./migrations/004_add_chat_messages.sql:/docker-entrypoint-initdb.d/z04_migration.sql:ro
      - ./migrations/005_add_verificaciones.sql:/docker-entrypoint-initdb.d/z05_migration.sql:ro
      - ./migrations/006_play_store_ready_updates.sql:/docker-entrypoint-initdb.d/z06_migration.sql:ro
      - ./migrations/007_add_fcm_token.sql:/docker-entrypoint-initdb.d/z07_migration.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-PetCareBD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-PetCareBD}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@petcare.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"

volumes:
  db_data:
